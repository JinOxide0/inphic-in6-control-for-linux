<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a44"/>
      <stop offset="0.55" stop-color="#111a29"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#a8bcdc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7dff"/>
      <stop offset="1" stop-color="#7fbcff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- 鼠标主体 -->
  <path d="M128 38c-31 0-54 23-54 56v50c0 43 23 63 54 63s54-20 54-63V94c0-33-23-56-54-56z"
        fill="url(#body)"/>
  <path d="M128 38c-31 0-54 23-54 56v22h108V94c0-33-23-56-54-56z"
        fill="#ffffff" fill-opacity="0.72"/>
  <path d="M128 38c-31 0-54 23-54 56v6h108v-6c0-33-23-56-54-56z"
        fill="#ffffff"/>

  <!-- 滚轮 -->
  <rect x="121" y="34" width="14" height="42" rx="7" fill="#131c2c"/>
  <rect x="122.5" y="36" width="11" height="38" rx="5.5" fill="url(#accent)" filter="url(#glow)"/>

  <!-- 底部灯带 -->
  <path d="M96 148c8 12 19 18 32 18s24-6 32-18" fill="none"
        stroke="url(#accent)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 8K 标记 -->
  <g>
    <rect x="146" y="176" width="70" height="38" rx="12" fill="#0d1626" stroke="#3f7dff" stroke-opacity="0.7" stroke-width="2"/>
    <text x="181" y="202" font-family="DejaVu Sans, Noto Sans, sans-serif"
          font-size="22" font-weight="700" text-anchor="middle" fill="#7fbcff">8K</text>
  </g>
</svg>
